<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Barcode → SKU Scanner (Offline Data)</title>
  <style>
    :root {
      --bg: #0b0f14;
      --card: #121824;
      --muted: #9aa7b2;
      --text: #e7eef5;
      --good: #4ade80;
      --bad: #fb7185;
      --border: rgba(255,255,255,.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 30% -10%, rgba(96,165,250,.25), transparent 60%),
                  radial-gradient(900px 500px at 90% 0%, rgba(74,222,128,.15), transparent 55%),
                  var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .wrap { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 14px; color: var(--muted); line-height: 1.45; }
    .grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
    .card {
      background: rgba(18,24,36,.92);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      backdrop-filter: blur(6px);
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button {
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 650;
      cursor: pointer;
    }
    button.primary {
      background: rgba(96,165,250,.18);
      border-color: rgba(96,165,250,.35);
    }
    button.danger {
      background: rgba(251,113,133,.14);
      border-color: rgba(251,113,133,.35);
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    input {
      width: 100%;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.25);
      color: var(--text);
      outline: none;
    }
    .status {
      font-weight: 700;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      color: var(--muted);
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }
    .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    .ok { color: var(--good); }
    .bad { color: var(--bad); }
    .big { font-size: 18px; font-weight: 800; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    video {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #000;
      max-height: 360px;
      object-fit: cover;
    }
    .kvs { display: grid; grid-template-columns: 120px 1fr; gap: 6px 10px; margin-top: 8px; }
    .kvs div:nth-child(odd) { color: var(--muted); }
    .hist {
      max-height: 220px;
      overflow: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .hist-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 10px;
      align-items: center;
    }
    .hist-item:last-child { border-bottom: none; }
    .small { font-size: 12px; color: var(--muted); }
    .right { text-align: right; }
    @media (min-width: 860px) {
      .grid { grid-template-columns: 1.2fr .8fr; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Barcode → SKU Scanner</h1>
  <p>Uses your Excel data baked into this page (no uploads). <b>Camera needs HTTPS</b> (Netlify / GitHub Pages) or <b>http://localhost</b>.</p>

  <div class="grid">
    <div class="card">
      <div class="row" style="justify-content: space-between;">
        <div class="status" id="status">
          <span class="pill">DATA</span>
          <span id="dataCount">Loading…</span>
        </div>
        <div class="row">
          <button class="primary" id="startBtn">Start Camera Scan</button>
          <button class="danger" id="stopBtn" disabled>Stop</button>
        </div>
      </div>

      <div style="margin-top: 12px;">
        <video id="video" playsinline muted></video>
      </div>

      <div style="margin-top: 12px;">
        <label class="small">Manual barcode entry (fast fallback)</label>
        <div class="row" style="margin-top: 6px;">
          <div style="flex: 1 1 260px;">
            <input id="manual" placeholder="Type/paste barcode, then press Enter" inputmode="numeric" />
          </div>
          <button id="lookupBtn">Lookup</button>
          <button id="clearBtn">Clear</button>
        </div>
      </div>

      <div style="margin-top: 12px;" class="card" id="resultCard">
        <div class="row" style="justify-content: space-between;">
          <div>
            <div class="small">Last scan</div>
            <div class="big mono" id="lastBarcode">—</div>
          </div>
          <div class="row">
            <button id="copySkuBtn" disabled>Copy SKU</button>
            <button id="copyBarcodeBtn" disabled>Copy Barcode</button>
          </div>
        </div>
        <div id="matchLine" style="margin-top: 10px;" class="big">—</div>
        <div class="kvs" id="details" style="display:none;"></div>
        <div id="dupesBox" style="display:none; margin-top:10px;"></div>
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content: space-between;">
        <div>
          <div class="small">Scan history</div>
          <div class="small">Newest at top</div>
        </div>
        <button id="clearHistBtn">Clear history</button>
      </div>
      <div class="hist" id="history" style="margin-top: 10px;"></div>
    </div>
  </div>

  <p class="small" style="margin-top:14px;">
    If a barcode has multiple matches (different units/pack sizes), the app will show all of them.
  </p>
</div>

    els.details.innerHTML = `
      <div>SKU</div><div class="mono">${escapeHtml(item.sku)}</div>
      <div>Description</div><div>${escapeHtml(item.description || '')}</div>
      <div>Unit</div><div>${escapeHtml(item.fromUnit || '')}</div>
      <div>Pack size</div><div>${item.packSize ?? '—'}</div>
    `;
    els.copySkuBtn.disabled = false;
    lastMatch = { barcode, item, multi: null };
    beep(true);
    addHistory(barcode, item.sku, item.fromUnit || '');
  }

  function lookup(barcodeRaw) {
    const barcode = normalizeBarcode(barcodeRaw);
    if (!barcode) return;

    if (dupes[barcode]) {
      const multi = [mapping[barcode], ...dupes[barcode]].filter(Boolean);
      renderResult(barcode, null, multi);
    } else {
      renderResult(barcode, mapping[barcode] || null, null);
    }
  }

  async function startScan() {
    els.startBtn.disabled = true;
    els.stopBtn.disabled = false;
    els.status.innerHTML = `<span class="pill">CAMERA</span><span>Starting…</span>`;

    try {
      // Stops any previous stream
      if (controls) controls.stop();

      // Use the modern @zxing/browser API
      const reader = new ZXingBrowser.BrowserMultiFormatReader();
      controls = await reader.decodeFromVideoDevice(
        undefined, // auto-select (usually back camera on phones)
        els.video,
        (result, err) => {
          if (result) {
            lookup(result.getText());
          }
        }
      );

      els.status.innerHTML = `<span class="pill">CAMERA</span><span class="ok">Scanning</span>`;
    } catch (e) {
      console.error(e);
      els.status.innerHTML = `<span class="pill">CAMERA</span><span class="bad">Blocked / not available</span>`;
      els.matchLine.innerHTML = `<span class="bad">Camera error:</span> ${escapeHtml(e.message || String(e))}`;
      els.startBtn.disabled = false;
      els.stopBtn.disabled = true;
    }
  }

  function stopScan() {
    if (controls) {
      controls.stop();
      controls = null;
    }
    els.status.innerHTML = `<span class="pill">CAMERA</span><span>Stopped</span>`;
    els.startBtn.disabled = false;
    els.stopBtn.disabled = true;
  }

  els.startBtn.addEventListener('click', startScan);
  els.stopBtn.addEventListener('click', stopScan);
  els.lookupBtn.addEventListener('click', () => lookup(els.manual.value));
  els.manual.addEventListener('keydown', (e) => { if (e.key === 'Enter') lookup(els.manual.value); });
  els.clearBtn.addEventListener('click', () => { els.manual.value=''; els.manual.focus(); });
  els.clearHistBtn.addEventListener('click', () => { history.length = 0; renderHistory(); });
  els.copySkuBtn.addEventListener('click', () => { if (lastMatch?.item?.sku) copyText(lastMatch.item.sku); });
  els.copyBarcodeBtn.addEventListener('click', () => { if (lastMatch?.barcode) copyText(lastMatch.barcode); });

  renderHistory();
</script>
</body>
</html>
